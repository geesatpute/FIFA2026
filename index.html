<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 — Group Stage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f4;--bg3:#f0efed;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#9a9a9a;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --green:#27500A;--green-bg:#EAF3DE;--live:#3B6D11;
  --star:#B57B00;--r:12px;--rs:8px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;
  --text:#f0f0f0;--text2:#a0a0a0;--text3:#6a6a6a;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);
  --blue:#85B7EB;--blue-bg:#042C53;
  --green:#C0DD97;--green-bg:#173404;--live:#639922;
  --star:#EF9F27;
}}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg3);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
.site-header{background:var(--bg);border-bottom:0.5px solid var(--border);padding:1rem 1.5rem;position:sticky;top:0;z-index:100}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.site-title{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.title-emoji{font-family:'Noto Color Emoji',sans-serif;font-size:22px}
.last-updated{font-size:11px;color:var(--text3)}
.refresh-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:5px 12px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;transition:background .15s;font-family:inherit}
.refresh-btn:hover{background:var(--bg2)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{animation:spin 1s linear infinite}
.controls-bar{background:var(--bg);border-bottom:0.5px solid var(--border);padding:.75rem 1.5rem;position:sticky;top:57px;z-index:99}
.controls-inner{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.controls-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.search-input{height:32px;padding:0 10px;border:0.5px solid var(--border2);border-radius:20px;background:var(--bg2);color:var(--text);font-size:13px;font-family:inherit;width:180px;outline:none}
.search-input:focus{border-color:var(--blue)}
.pill{display:inline-flex;align-items:center;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:0.5px solid var(--border);background:var(--bg);color:var(--text2);transition:background .12s;user-select:none}
.pill:hover{background:var(--bg2)}
.pill.active{background:var(--bg3);color:var(--text);border-color:var(--border2)}
.main{max-width:1100px;margin:0 auto;padding:1.5rem}
.banner{padding:.75rem 1rem;border-radius:var(--rs);font-size:13px;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.banner-error{background:#fee2e2;color:#991b1b;border:0.5px solid #fca5a5}
.banner-loading{background:var(--bg2);color:var(--text2);border:0.5px solid var(--border)}
.banner-success{background:var(--green-bg);color:var(--green);border:0.5px solid var(--border)}
@media(prefers-color-scheme:dark){.banner-error{background:#450a0a;color:#fca5a5;border-color:#7f1d1d}}
.date-section{margin-bottom:1.75rem}
.date-heading{font-size:13px;font-weight:600;padding:.3rem 0;margin-bottom:.6rem;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:8px}
.date-count{font-size:11px;font-weight:400;color:var(--text3)}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.match-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r);padding:12px 14px}
.match-card.live{border-color:var(--live);border-width:1.5px}
.match-card.today{border-color:var(--blue);border-width:1.5px}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.card-meta{font-size:11px;color:var(--text3)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
.badge-live{background:var(--green-bg);color:var(--green)}
.badge-today{background:var(--blue-bg);color:var(--blue)}
.badge-played{background:var(--bg2);color:var(--text2)}
.badge-upcoming{background:var(--bg2);color:var(--text2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.live-dot{width:6px;height:6px;background:var(--live);border-radius:50%;display:inline-block;animation:pulse 1.4s ease-in-out infinite}
.teams-row{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.team-block{flex:1;min-width:0}
.team-block.away{text-align:right}
.flag{font-family:'Noto Color Emoji',sans-serif;font-size:26px;line-height:1;display:block;margin-bottom:3px}
.flag.away{text-align:right}
.team-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-rank{font-size:10px;color:var(--text3);margin-top:1px}
.score-block{text-align:center;min-width:56px;flex-shrink:0}
.score-nums{font-size:22px;font-weight:600;letter-spacing:-1px;white-space:nowrap}
.score-sep{color:var(--text3);padding:0 2px}
.score-time{font-size:12px;color:var(--text2);white-space:nowrap}
.live-min{font-size:10px;color:var(--live);font-weight:600;margin-top:2px}
.detail{border-top:0.5px solid var(--border);padding-top:8px;margin-top:2px}
.detail-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:3px}
.two-col{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.col-l{flex:1;min-width:0}
.col-r{flex:1;min-width:0;text-align:right}
.scorer-item,.star-item{font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.65}
.star-g{color:var(--star)}
.no-results{text-align:center;padding:3rem 1rem;color:var(--text3)}
.source-note{font-size:11px;color:var(--text3);margin-bottom:1rem}
.site-footer{text-align:center;padding:2rem 1rem;font-size:11px;color:var(--text3);border-top:0.5px solid var(--border);margin-top:1rem}
.site-footer a{color:inherit}
@media(max-width:600px){
  .site-header,.controls-bar{padding-left:1rem;padding-right:1rem}
  .main{padding:1rem}
  .cards-grid{grid-template-columns:1fr}
  .search-input{width:140px}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="site-title"><span class="title-emoji">🏆</span> FIFA World Cup 2026</div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="last-updated" id="ts">Loading…</span>
      <button class="refresh-btn" onclick="doFetch()">
        <svg id="ri" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>

    </div>
  </div>
</header>

<div class="controls-bar">

    <div class="controls-row">

        <span class="pill active" data-s="all"      onclick="setSt(this)">All</span>
        <span class="pill"        data-s="played"   onclick="setSt(this)">Played</span>
        <span class="pill"        data-s="live"     onclick="setSt(this)">Live</span>
        <span class="pill"        data-s="upcoming" onclick="setSt(this)">Upcoming</span>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:4px" id="gp">
      <span class="pill active" data-g="all"     onclick="setGr(this)">All groups</span>
      <span class="pill" data-g="Group A" onclick="setGr(this)">A</span>
      <span class="pill" data-g="Group B" onclick="setGr(this)">B</span>
      <span class="pill" data-g="Group C" onclick="setGr(this)">C</span>
      <span class="pill" data-g="Group D" onclick="setGr(this)">D</span>
      <span class="pill" data-g="Group E" onclick="setGr(this)">E</span>
      <span class="pill" data-g="Group F" onclick="setGr(this)">F</span>
      <span class="pill" data-g="Group G" onclick="setGr(this)">G</span>
      <span class="pill" data-g="Group H" onclick="setGr(this)">H</span>
      <span class="pill" data-g="Group I" onclick="setGr(this)">I</span>
      <span class="pill" data-g="Group J" onclick="setGr(this)">J</span>
      <span class="pill" data-g="Group K" onclick="setGr(this)">K</span>
      <span class="pill" data-g="Group L" onclick="setGr(this)">L</span>
    </div>
  </div>
</div>

<main class="main">
  <div class="banner banner-loading" id="banner">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="bicon" style="flex-shrink:0">
      <path d="M21 12a9 9 0 1 1-6.22-8.56"/>
    </svg>
    <span id="bmsg">Loading match data…</span>
  </div>
  <div id="output"></div>
</main>

<footer class="site-footer">
  Live data from <a href="https://www.football-data.org" target="_blank" rel="noopener">football-data.org</a>
  · Refreshes every 60 s during live matches, every 5 min otherwise
</footer>

// API name → META key (covers every known variant football-data.org uses)
const API_ALIAS = {
  'Korea Republic':           'Korea Republic',
  'Republic of Korea':        'Korea Republic',

const SHORT = {
  'Bosnia and Herzegovina':   'Bosnia & Herz.',
  'Korea Republic':           'South Korea',
  'United States':            'USA',
  "Côte d'Ivoire":            'Ivory Coast',
  'Cabo Verde':               'Cape Verde',
};
const sf = n => SHORT[n] || SHORT[API_ALIAS[n]] || n;
const meta = n => {
  const key = API_ALIAS[n] || n;
  return META[key] || META[n] || {rank:'—',stars:[],iso:''};
};

// Flag from ISO-2
const SPEC = {GBSCT:'🏴󠁧󠁢󠁳󠁣󠁴󠁿',GBENG:'🏴󠁧󠁢󠁥󠁮󠁧󠁿'};
function flag(iso){
  if(!iso) return '🏳';
  if(SPEC[iso]) return SPEC[iso];
  if(iso.length!==2) return '🏳';
  const o=0x1F1E6-65;
  return String.fromCodePoint(iso.toUpperCase().charCodeAt(0)+o)+
         String.fromCodePoint(iso.toUpperCase().charCodeAt(1)+o);
}

// ── State ─────────────────────────────────────────────────────────────────
let matches=[], activeSt='all', activeGr='all', timer=null, liveMode=false;

// ── Fetch with proxy fallback ─────────────────────────────────────────────
async function tryFetch(proxyFn){
  const url = proxyFn(API_BASE);
  const res = await fetch(url, {
    headers:{'X-Auth-Token': API_KEY},
    signal: AbortSignal.timeout(8000)
  });
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if(!data.matches) throw new Error('No matches field in response');
  return data.matches;
}

async function doFetch(){
  setBanner('loading','Loading live data…');
  document.getElementById('ri').classList.add('spinning');

  let lastErr = '';
  for(const proxy of PROXIES){
    try{
      const m = await tryFetch(proxy);
      matches = m;
      liveMode = m.some(x=>x.status==='IN_PLAY'||x.status==='PAUSED'||x.status==='HALFTIME');
      setBanner('success', `Live data loaded · ${liveMode?'Refreshing every 60 s':'Refreshing every 5 min'}`);
      document.getElementById('ts').textContent = 'Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      render();
      scheduleRefresh();
      document.getElementById('ri').classList.remove('spinning');
      return;
    } catch(e){ lastErr=e.message; }
  }

  // All proxies failed — show static data
  setBanner('error','Live scores unavailable ('+lastErr+'). Showing last known results.');
  document.getElementById('ts').textContent = 'Live data unavailable';
  document.getElementById('ri').classList.remove('spinning');
  loadStatic();
  scheduleRefresh();
}

function scheduleRefresh(){
  clearTimeout(timer);
  timer = setTimeout(doFetch, liveMode ? 60000 : 300000);
}

function setBanner(type, msg){
  const b=document.getElementById('banner');
  const i=document.getElementById('bicon');
  b.style.display='flex';
  b.className='banner banner-'+type;
  document.getElementById('bmsg').textContent=msg;
  if(type==='loading') i.style.animation='spin 1s linear infinite';
  else{ i.style.animation=''; }
  if(type==='success') setTimeout(()=>{ b.style.display='none'; }, 4000);
}

// ── Filters ───────────────────────────────────────────────────────────────
function setSt(el){
  document.querySelectorAll('#sp .pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active'); activeSt=el.dataset.s; render();
}
function setGr(el){
  document.querySelectorAll('#gp .pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active'); activeGr=el.dataset.g; render();
}

// ── Render ────────────────────────────────────────────────────────────────
function render(){
  const q=(document.getElementById('search').value||'').trim().toLowerCase();
  const today=localDateKey(new Date().toISOString());

  let ms=matches;
  if(activeGr!=='all') ms=ms.filter(m=>m.group===activeGr);
  if(activeSt==='played')   ms=ms.filter(m=>m.status==='FINISHED');
  else if(activeSt==='live') ms=ms.filter(m=>['IN_PLAY','PAUSED','HALFTIME'].includes(m.status));
  else if(activeSt==='upcoming') ms=ms.filter(m=>['SCHEDULED','TIMED'].includes(m.status));
  if(q) ms=ms.filter(m=>
    m.homeTeam.name.toLowerCase().includes(q)||
    m.awayTeam.name.toLowerCase().includes(q)||
    sf(m.homeTeam.name).toLowerCase().includes(q)||
    sf(m.awayTeam.name).toLowerCase().includes(q)
  );

  const out=document.getElementById('output');
  if(!ms.length){out.innerHTML='<div class="no-results">No matches found</div>';return;}

  const byDate={},order=[];
  ms.forEach(m=>{
    const d=localDateKey(m.utcDate);
    if(!byDate[d]){byDate[d]=[];order.push(d);}
    byDate[d].push(m);
  });

  let html='';
  order.forEach(dk=>{
    const arr=byDate[dk];
    const label=new Date(dk+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    html+=`<div class="date-section">
      <div class="date-heading">${label}<span class="date-count">${arr.length} match${arr.length>1?'es':''}</span></div>
      <div class="cards-grid">`;
    arr.forEach(m=>{html+=card(m,today);});
    html+='</div></div>';
  });
  out.innerHTML=html;
}

function card(m,today){
  const hn=m.homeTeam.name, an=m.awayTeam.name;
  const hm=meta(hn), am=meta(an);
  const hf=flag(hm.iso), af=flag(am.iso);
  const st=m.status;
  const grp=(m.group||'').replace('Group ','');
  const matchDate=localDateKey(m.utcDate);
  const isToday=matchDate===today;
  const isLive=['IN_PLAY','PAUSED','HALFTIME'].includes(st);
  const isDone=st==='FINISHED';

  let badge='', cc='match-card';
  if(isLive){
    cc+=' live';
    const min=m.minute?` ${m.minute}'`:st==='HALFTIME'?' HT':'';
    badge=`<span class="badge badge-live"><span class="live-dot"></span> Live${min}</span>`;
  } else if(isDone){
    badge=`<span class="badge badge-played">Final</span>`;
  } else if(isToday){
    cc+=' today';
    badge=`<span class="badge badge-today">◑ Today · ${fmtTime(m.utcDate)}</span>`;
  } else {
    badge=`<span class="badge badge-upcoming">${fmtTime(m.utcDate)}</span>`;
  }

  let scoreHtml='';
  if(isDone||isLive){
    const hs=m.score?.fullTime?.home??m.score?.halfTime?.home??'–';
    const as=m.score?.fullTime?.away??m.score?.halfTime?.away??'–';
    scoreHtml=`<div class="score-nums">${hs}<span class="score-sep">–</span>${as}</div>`;
    if(st==='HALFTIME') scoreHtml+=`<div class="live-min">Half time</div>`;
    else if(m.minute) scoreHtml+=`<div class="live-min">${m.minute}'</div>`;
  } else {
    scoreHtml=`<div class="score-time">${fmtTime(m.utcDate)}</div>`;
  }

  // Scorers — normalise team names before comparing so alias variants match
  const goals=m.goals||[];
  const hKey=API_ALIAS[hn]||hn;
  const aKey=API_ALIAS[an]||an;
  const hg=goals.filter(g=>{ const k=API_ALIAS[g.team?.name]||g.team?.name; return k===hKey||g.team?.name===hn; });
  const ag=goals.filter(g=>{ const k=API_ALIAS[g.team?.name]||g.team?.name; return k===aKey||g.team?.name===an; });
  let scorerHtml='';
  if((isDone||isLive)&&(hg.length||ag.length)){
    const lastName=n=>(n||'?').split(' ').pop();
    const hsc=hg.map(g=>`<div class="scorer-item">⚽ ${lastName(g.scorer?.name)} ${g.minute}'</div>`).join('');
    const asc=ag.map(g=>`<div class="scorer-item">${lastName(g.scorer?.name)} ${g.minute}' ⚽</div>`).join('');
    scorerHtml=`<div style="margin-bottom:6px">
      <div class="detail-label">Goal scorers</div>
      <div class="two-col">
        <div class="col-l">${hsc||(ag.length?'<div class="scorer-item" style="opacity:.3">—</div>':'')}</div>
        <div class="col-r">${asc||(hg.length?'<div class="scorer-item" style="opacity:.3">—</div>':'')}</div>
      </div></div>`;
  }

  const hs=(hm.stars||[]).slice(0,2), as2=(am.stars||[]).slice(0,2);
  const starsHtml=`<div>
    <div class="detail-label">Key players</div>
    <div class="two-col">
      <div class="col-l">${hs.map(s=>`<div class="star-item"><span class="star-g">★</span> ${s}</div>`).join('')}</div>
      <div class="col-r">${as2.map(s=>`<div class="star-item">${s} <span class="star-g">★</span></div>`).join('')}</div>
    </div></div>`;

  return `<div class="${cc}">
    <div class="card-top"><span class="card-meta">Group ${grp}</span>${badge}</div>
    <div class="teams-row">
      <div class="team-block">
        <span class="flag">${hf}</span>
        <div class="team-name">${sf(hn)}</div>
        <div class="team-rank">FIFA #${hm.rank}</div>
      </div>
      <div class="score-block">${scoreHtml}</div>
      <div class="team-block away">
        <span class="flag away">${af}</span>
        <div class="team-name">${sf(an)}</div>
        <div class="team-rank">FIFA #${am.rank}</div>
      </div>
    </div>
    <div class="detail">${scorerHtml}${starsHtml}</div>
  </div>`;
}

function fmtTime(utc){
  return new Date(utc).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZoneName:'short'});
}

function localDateKey(utc){
  const d=new Date(utc);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
