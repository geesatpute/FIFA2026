<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FIFA World Cup 2026 — Group Stage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f4;--bg3:#eeece9;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#9a9a9a;
  --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.18);
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --green:#27500A;--green-bg:#EAF3DE;--live-col:#3B6D11;
  --star:#B57B00;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
  --text:#f0f0f0;--text2:#a0a0a0;--text3:#6a6a6a;
  --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.18);
  --blue:#85B7EB;--blue-bg:#042C53;
  --green:#C0DD97;--green-bg:#173404;--live-col:#639922;
  --star:#EF9F27;
}}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg3);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}

/* Header */
.hdr{background:var(--bg);border-bottom:1px solid var(--border);padding:.85rem 1rem;position:sticky;top:0;z-index:100;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hdr-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.hdr-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.hdr-emoji{font-family:'Noto Color Emoji',sans-serif;font-size:20px;line-height:1}
.hdr-right{display:flex;align-items:center;gap:10px;min-width:0}
.hdr-ts{font-size:11px;color:var(--text3);white-space:nowrap}
.btn-refresh{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:5px 11px;border-radius:20px;border:1px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;white-space:nowrap;touch-action:manipulation}
.btn-refresh:active{background:var(--bg2)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite}

/* Controls */
.cbar{background:var(--bg);border-bottom:1px solid var(--border);padding:.6rem 1rem;position:sticky;top:53px;z-index:99;overflow-x:auto;-webkit-overflow-scrolling:touch}
.cbar-inner{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
.crow{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;min-width:max-content}
.search{height:30px;padding:0 10px;border:1px solid var(--border2);border-radius:20px;background:var(--bg2);color:var(--text);font-size:13px;font-family:inherit;width:155px;outline:none;-webkit-appearance:none}
.search:focus{border-color:var(--blue)}
.pill{display:inline-flex;align-items:center;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text2);white-space:nowrap;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pill:active,.pill.on{background:var(--bg3);color:var(--text);border-color:var(--border2)}

/* Main */
.main{max-width:1100px;margin:0 auto;padding:1.2rem 1rem 2rem}

/* Banner */
.banner{padding:.65rem .9rem;border-radius:8px;font-size:12px;margin-bottom:1rem;display:none;align-items:center;gap:7px}
.b-err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.b-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--border)}
@media(prefers-color-scheme:dark){.b-err{background:#450a0a;color:#fca5a5;border-color:#7f1d1d}}

/* Date sections */
.dsec{margin-bottom:1.5rem}
.dhead{font-size:12px;font-weight:600;padding:.3rem 0;margin-bottom:.55rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px}
.dcnt{font-size:11px;font-weight:400;color:var(--text3)}

/* Cards grid — 1 col on mobile, 2+ on wider */
.cgrid{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:600px){.cgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.cgrid{grid-template-columns:repeat(3,1fr)}}

/* Card */
.card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:11px 13px}
.card.clive{border-color:var(--live-col);border-width:1.5px}
.card.ctoday{border-color:var(--blue);border-width:1.5px}
.ctop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cmeta{font-size:11px;color:var(--text3)}

/* Badges */
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.blive{background:var(--green-bg);color:var(--green)}
.btoday{background:var(--blue-bg);color:var(--blue)}
.bplayed{background:var(--bg2);color:var(--text2)}
.bup{background:var(--bg2);color:var(--text2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.ldot{width:6px;height:6px;background:var(--live-col);border-radius:50%;display:inline-block;flex-shrink:0;animation:pulse 1.4s ease-in-out infinite}

/* Teams row */
.trow{display:flex;align-items:center;gap:5px;margin-bottom:8px}
.tblk{flex:1;min-width:0}
.tblk.away{text-align:right}
.flag{font-family:'Noto Color Emoji',sans-serif;font-size:28px;line-height:1;display:block;margin-bottom:2px}
.flag.away{text-align:right}
.tname{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trank{font-size:10px;color:var(--text3);margin-top:1px}

/* Score */
.sblk{text-align:center;min-width:54px;flex-shrink:0}
.snums{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1}
.ssep{color:var(--text3);padding:0 2px;font-weight:400}
.stime{font-size:11px;color:var(--text2);line-height:1.4}
.smin{font-size:10px;color:var(--live-col);font-weight:600;margin-top:2px}

/* Detail */
.det{border-top:1px solid var(--border);padding-top:8px;margin-top:2px}
.dlbl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:3px}
.dcols{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.dcl{flex:1;min-width:0}
.dcr{flex:1;min-width:0;text-align:right}
.si,.sti{font-size:10px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.7}
.starg{color:var(--star)}

.nores{text-align:center;padding:3rem 1rem;color:var(--text3)}
footer{text-align:center;padding:1.5rem 1rem;font-size:11px;color:var(--text3);border-top:1px solid var(--border);margin-top:.5rem}
footer a{color:inherit}
</style>
</head>

      <span class="pill" data-g="J" onclick="setGr(this)">J</span>
      <span class="pill" data-g="K" onclick="setGr(this)">K</span>
      <span class="pill" data-g="L" onclick="setGr(this)">L</span>
    </div>
  </div>
</div>

<main class="main">
  <div class="banner b-err" id="banner"></div>
  <div id="out"></div>
</main>

<footer>
  Live data: <a href="https://football-data.org" target="_blank" rel="noopener">football-data.org</a>
  &middot; Auto-refreshes every 60 s during live matches
</footer>

// ── Live API overlay ───────────────────────────────────────────────────────
const KEY='98c4c0a58ddf45e79c31f391aabecfbf';
const APIURL='https://api.football-data.org/v4/competitions/WC/matches?season=2026';
const PROXIES=[
  u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u=>`https://thingproxy.freeboard.io/fetch/${u}`,
];

// Normalize API team names to match our display names
const NMAP={
  'Korea Republic':'South Korea','Republic of Korea':'South Korea',
  'Bosnia and Herzegovina':'Bosnia','Bosnia & Herzegovina':'Bosnia',
  'United States':'USA',
  "Cote d'Ivoire":'Ivory Coast',"Côte d'Ivoire":'Ivory Coast',
  'Cabo Verde':'Cape Verde',
  'Congo DR':'DR Congo','Democratic Republic of Congo':'DR Congo',
  'Turkiye':'Turkey','Türkiye':'Turkey',
};
const norm=n=>NMAP[n]||n;

async function tryP(fn){
  const r=await fetch(fn(APIURL),{headers:{'X-Auth-Token':KEY},signal:AbortSignal.timeout(8000)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d=await r.json();
  if(!Array.isArray(d.matches)) throw new Error('bad');
  return d.matches;
}

let rtimer=null;
async function doFetch(){
  const ri=document.getElementById('ri');
  ri.classList.add('spin');
  let api=null,err='';
  for(const p of PROXIES){ try{api=await tryP(p);break;}catch(e){err=e.message;} }
  ri.classList.remove('spin');
  if(api){ merge(api); stamp(); showB('ok','Live data loaded'); }
  else { showB('err','Could not load live data ('+err+') — showing last known results'); }
  render();
  const live=M.some(x=>x.st==='live');
  clearTimeout(rtimer);
  rtimer=setTimeout(doFetch,live?60000:300000);
}

function stamp(){
  document.getElementById('ts').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

function merge(api){
  api.forEach(a=>{
    const hn=norm(a.homeTeam?.name||''), an=norm(a.awayTeam?.name||'');
    const loc=M.find(m=>m.h===hn&&m.a===an);
    if(!loc) return;
    const s=a.status;
    if(s==='FINISHED') loc.st='played';
    else if(['IN_PLAY','PAUSED','HALFTIME'].includes(s)) loc.st='live';
    else loc.st='upcoming';
    if(s!=='SCHEDULED'&&s!=='TIMED'){
      loc.hs=a.score?.fullTime?.home??a.score?.halfTime?.home??null;
      loc.as=a.score?.fullTime?.away??a.score?.halfTime?.away??null;
    }
    if(Array.isArray(a.goals)&&a.goals.length){
      const last=n=>(n||'?').trim().split(' ').pop();
      loc.hsc=a.goals.filter(g=>norm(g.team?.name||'')===hn).map(g=>`${last(g.scorer?.name)} ${g.minute}'`);
      loc.asc=a.goals.filter(g=>norm(g.team?.name||'')===an).map(g=>`${last(g.scorer?.name)} ${g.minute}'`);
    }
    loc.min=a.minute||null;
    loc.phase=s==='HALFTIME'?'HT':null;
  });
}

function showB(type,msg){
  const b=document.getElementById('banner');
  b.className='banner b-'+type;
  b.textContent=msg;
  b.style.display='flex';
  if(type==='ok') setTimeout(()=>{b.style.display='none';},3000);
}

// ── Filters ────────────────────────────────────────────────────────────────
let aSt='all',aGr='all';
function setSt(el){document.querySelectorAll('#sp .pill').forEach(p=>p.classList.remove('on'));el.classList.add('on');aSt=el.dataset.s;render();}
function setGr(el){document.querySelectorAll('#gp .pill').forEach(p=>p.classList.remove('on'));el.classList.add('on');aGr=el.dataset.g;render();}

function today(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// ── Render ─────────────────────────────────────────────────────────────────
function render(){
  const q=(document.getElementById('srch').value||'').trim().toLowerCase();
  const td=today();
  let ms=M;
  if(aGr!=='all') ms=ms.filter(m=>m.g===aGr);
  if(aSt==='played')   ms=ms.filter(m=>m.st==='played');
  else if(aSt==='live') ms=ms.filter(m=>m.st==='live');
  else if(aSt==='upcoming') ms=ms.filter(m=>m.st==='upcoming');
  if(q) ms=ms.filter(m=>m.h.toLowerCase().includes(q)||m.a.toLowerCase().includes(q));

  const out=document.getElementById('out');
  if(!ms.length){out.innerHTML='<div class="nores">No matches found</div>';return;}

  const byD={},ord=[];
  ms.forEach(m=>{if(!byD[m.d]){byD[m.d]=[];ord.push(m.d);}byD[m.d].push(m);});

  let html='';
  ord.forEach(dk=>{
    const arr=byD[dk];
    const lbl=new Date(dk+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    html+=`<div class="dsec"><div class="dhead">${lbl}<span class="dcnt">${arr.length} match${arr.length>1?'es':''}</span></div><div class="cgrid">`;
    arr.forEach(m=>{html+=card(m,td);});
    html+='</div></div>';
  });
  out.innerHTML=html;
}

function card(m,td){
  const live=m.st==='live', done=m.st==='played', isToday=m.d===td;
  let bdg='',cc='card';
  if(live){
    cc+=' clive';
    const min=m.min?` ${m.min}'`:m.phase?` ${m.phase}`:'';
    bdg=`<span class="bdg blive"><span class="ldot"></span> Live${min}</span>`;
  } else if(done){
    bdg=`<span class="bdg bplayed">Final</span>`;
  } else if(isToday){
    cc+=' ctoday';
    bdg=`<span class="bdg btoday">&#9684; Today &middot; ${m.t}</span>`;
  } else {
    bdg=`<span class="bdg bup">${m.t}</span>`;
  }

  let sc='';
  if(done||live){
    const h=m.hs!==null?m.hs:'&ndash;', a=m.as!==null?m.as:'&ndash;';
    sc=`<div class="snums">${h}<span class="ssep">&ndash;</span>${a}</div>`;
    if(m.phase) sc+=`<div class="smin">${m.phase}</div>`;
    else if(m.min) sc+=`<div class="smin">${m.min}'</div>`;
  } else {
    sc=`<div class="stime">${m.t}</div>`;
  }

  // Scorers — only shown when game is played or live
  let scorers='';
  if((done||live)&&(m.hsc.length||m.asc.length)){
    const hl=m.hsc.map(s=>`<div class="si">&#9917; ${s}</div>`).join('');
    const al=m.asc.map(s=>`<div class="si">${s} &#9917;</div>`).join('');
    scorers=`<div style="margin-bottom:5px">
      <div class="dlbl">Goal scorers</div>
      <div class="dcols">
        <div class="dcl">${hl||(m.asc.length?'<div class="si" style="opacity:.3">&#8212;</div>':'')}</div>
        <div class="dcr">${al||(m.hsc.length?'<div class="si" style="opacity:.3">&#8212;</div>':'')}</div>
      </div></div>`;
  }

  const hs=(m.hs2||[]).slice(0,2), as=(m.as2||[]).slice(0,2);
  const stars=`<div>
    <div class="dlbl">Key players</div>
    <div class="dcols">
      <div class="dcl">${hs.map(s=>`<div class="sti"><span class="starg">&#9733;</span> ${s}</div>`).join('')}</div>
      <div class="dcr">${as.map(s=>`<div class="sti">${s} <span class="starg">&#9733;</span></div>`).join('')}</div>
    </div></div>`;

  return `<div class="${cc}">
    <div class="ctop"><span class="cmeta">Group ${m.g}</span>${bdg}</div>
    <div class="trow">
      <div class="tblk">
        <span class="flag">${m.hf}</span>
        <div class="tname">${m.h}</div>
        <div class="trank">FIFA #${m.hr}</div>
      </div>
      <div class="sblk">${sc}</div>
      <div class="tblk away">
        <span class="flag away">${m.af}</span>
        <div class="tname">${m.a}</div>
        <div class="trank">FIFA #${m.ar}</div>
      </div>
    </div>
    <div class="det">${scorers}${stars}</div>
  </div>`;
}

doFetch();
</script>
